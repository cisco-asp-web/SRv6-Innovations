[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = true 
  hostname = "lab-telegraf"
  omit_hostname = false

# -------------------------------------------------------------------------
# OUTPUT: InfluxDB v2
# -------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["http://lab-influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "$INFLUX_ORG"
  bucket = "$INFLUX_BUCKET"

# -------------------------------------------------------------------------
# INPUT: gNMI Telemetry for Containerlab Nodes (IOS-XR / SONiC)
# -------------------------------------------------------------------------
[[inputs.gnmi]]
  addresses = [
    "clab-srv6-innovations-xrd01:57400",
    "clab-srv6-innovations-sonic-leaf-00:50051"
  ]
  
  username = "cisco"
  password = "cisco123"
  insecure_skip_verify = true

  [[inputs.gnmi.subscription]]
    name = "interfaces"
    path = "/interfaces/interface/state"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "interface_counters"
    path = "/interfaces/interface/state/counters"
    subscription_mode = "sample"
    sample_interval = "10s"

# -------------------------------------------------------------------------
# INPUT: MySQL Database Monitoring
# -------------------------------------------------------------------------
[[inputs.mysql]]
  ## Connects to the lab-mysql container over the internal docker network
  servers = ["admin:cisco123@tcp(lab-mysql:3306)/?tls=false"]
  metric_version = 2
  gather_table_io_waits = true
  gather_table_lock_waits = true
  gather_index_io_waits = true
  gather_event_waits = true
  gather_file_events_stats = true
  gather_perf_events_statements = true
  